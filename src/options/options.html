<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AILeetHub — Setup</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>

    <main class="shell">
      <header class="masthead">
        <div class="mark">AI</div>
        <div>
          <h1>AILeetHub</h1>
          <p>Accepted solutions land in GitHub with a Groq-written explanation.</p>
        </div>
      </header>

      <!-- 1. GitHub -->
      <section class="card">
        <div class="card__head">
          <h2><span class="step">1</span> GitHub</h2>
          <span id="github-state" class="pill">Not connected</span>
        </div>

        <label class="field">
          <span class="field__label">Personal access token</span>
          <div class="field__row">
            <input id="github-token" type="password" autocomplete="off" spellcheck="false"
              placeholder="github_pat_… or ghp_…" />
            <button id="github-connect" class="btn btn--primary" type="button">Connect</button>
          </div>
          <p class="hint">
            Fine-grained token with <strong>Contents: Read and write</strong> on the target repo, or a
            classic token with the <strong>repo</strong> scope.
            <a href="https://github.com/settings/tokens?type=beta" target="_blank" rel="noreferrer">Create one</a>.
            Stored only on this device.
          </p>
        </label>

        <div id="repo-section" class="field" hidden>
          <span class="field__label">Repository</span>
          <div class="field__row">
            <select id="repo-select"></select>
            <button id="repo-refresh" class="btn" type="button" title="Reload repositories">Refresh</button>
          </div>

          <details class="create">
            <summary>Create a new repository instead</summary>
            <div class="field__row">
              <input id="repo-new-name" type="text" placeholder="leetcode-solutions" spellcheck="false" />
              <label class="checkbox checkbox--inline">
                <input id="repo-new-private" type="checkbox" checked />
                <span>Private</span>
              </label>
              <button id="repo-create" class="btn" type="button">Create</button>
            </div>
          </details>
        </div>
      </section>

      <!-- 2. Groq -->
      <section class="card">
        <div class="card__head">
          <h2><span class="step">2</span> Groq</h2>
          <span id="groq-state" class="pill">Not verified</span>
        </div>

        <label class="field">
          <span class="field__label">API key</span>
          <div class="field__row">
            <input id="groq-key" type="password" autocomplete="off" spellcheck="false" placeholder="gsk_…" />
            <button id="groq-verify" class="btn btn--primary" type="button">Verify</button>
          </div>
          <p class="hint">
            Free key from <a href="https://console.groq.com/keys" target="_blank" rel="noreferrer">console.groq.com</a>.
            Optional — without it, READMEs are still written from a template.
          </p>
        </label>

        <label class="field">
          <span class="field__label">Model</span>
          <select id="groq-model"></select>
          <p class="hint">Verify the key to load the live model list from Groq.</p>
        </label>
      </section>

      <!-- 3. Preferences -->
      <section class="card">
        <div class="card__head">
          <h2><span class="step">3</span> Preferences</h2>
        </div>

        <label class="checkbox">
          <input id="pref-enabled" type="checkbox" />
          <span><strong>Sync accepted submissions</strong><em>Push automatically when LeetCode accepts a solution.</em></span>
        </label>

        <label class="checkbox">
          <input id="pref-ai" type="checkbox" />
          <span><strong>AI-written READMEs</strong><em>Intuition, approach and complexity, generated by Groq.</em></span>
        </label>

        <label class="checkbox">
          <input id="pref-index" type="checkbox" />
          <span><strong>Maintain repository index</strong><em>Keep a solved-problems table in the root README.</em></span>
        </label>

        <label class="checkbox">
          <input id="pref-focus" type="checkbox" />
          <span><strong>Focus mode</strong><em>Hide LeetCode premium upsell banners.</em></span>
        </label>

        <label class="field">
          <span class="field__label">Folder layout</span>
          <select id="pref-folder">
            <option value="topic">By topic — Dynamic Programming/0322-coin-change/</option>
            <option value="difficulty">By difficulty — Medium/0322-coin-change/</option>
            <option value="flat">Flat — 0322-coin-change/</option>
          </select>
        </label>
      </section>

      <footer class="actions">
        <span id="status" class="status" role="status"></span>
        <button id="save" class="btn btn--primary btn--wide" type="button">Save settings</button>
      </footer>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
